name: Build project

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libpulse-dev \
            libasound2-dev \
            libudev-dev \
            libopenal-dev \
            libglfw3-dev

      - name: Build raylib dependency
        run: |
          cmake -S raylib -B raylib/build -DCMAKE_BUILD_TYPE=Release
          cmake --install raylib/build --prefix $PWD/raylib/build/install

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/raylib/build/install

      - name: Build executable
        run: cmake --build build --config Release --target testgame -- -j
